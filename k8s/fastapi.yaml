apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: decisions-data
  namespace: credit-default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi
  namespace: credit-default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fastapi
          image: credit-default-fastapi:m4
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: DECISIONS_DB
              value: /var/lib/credit-default/decisions.db
            - name: OMP_NUM_THREADS
              value: "2"
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: decisions-data
              mountPath: /var/lib/credit-default
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
      volumes:
        - name: decisions-data
          persistentVolumeClaim:
            claimName: decisions-data
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi
  namespace: credit-default
spec:
  type: ClusterIP
  selector:
    app: fastapi
  ports:
    - name: http
      port: 8000
      targetPort: http
