name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rust-runtime
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install Rust and rustfmt
        run: rustup toolchain install 1.91.1 --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo +1.91.1 fmt --check
      - name: Run tests
        run: cargo +1.91.1 test --locked
      - name: Build
        run: cargo +1.91.1 build --locked

  python:
    name: Python
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.14"
      - name: Install dependencies
        run: >-
          python -m pip install --only-binary=:all:
          -r requirements.txt -c requirements-docker.lock
      - name: Check dependencies
        run: python -m pip check
      - name: Run tests
        run: python -m pytest tests/ -q -rs

  docker:
    name: Docker images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build both images
        run: docker compose build
